# 发布流水线
#
# 触发方式：
#   1. 推送 `vX.Y.Z` 标签：构建三平台安装包并自动发布 GitHub Release；
#   2. Actions 页面手动触发（Run workflow）：默认只构建不发布；
#      在 tag 输入框里填已有标签（如 v1.0.0）则构建并发布/补发到该标签。
#
# 发一个版本只需要：
#
#   git tag v0.2.0
#   git push origin v0.2.0        # → 构建 + 发布一气呵成
#
# 标签里的版本号会自动写入 tauri.conf.json，产物文件名与 Release 版本一致，
# 无需手动改版本号再提交。

name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "要发布到的标签（如 v1.0.0）；留空则只构建不发布"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            bundles: msi,nsis
          - name: macOS Apple Silicon
            os: macos-latest
            bundles: dmg
          - name: Linux x64
            os: ubuntu-22.04
            bundles: deb,appimage
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev

      - name: Sync version from tag
        if: startsWith(github.ref, 'refs/tags/v') || inputs.tag != ''
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}
        run: |
          node --input-type=module - <<'NODE'
          import { readFileSync, writeFileSync } from "node:fs";
          const version = process.env.RELEASE_TAG.replace(/^v/, "");
          const path = "src-tauri/tauri.conf.json";
          const conf = JSON.parse(readFileSync(path, "utf8"));
          conf.version = version;
          writeFileSync(path, JSON.stringify(conf, null, 2) + "\n");
          console.log(`set tauri.conf.json version to ${version}`);
          NODE

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter server prisma:generate

      - name: Prepare Node SEA sidecar
        run: node scripts/prepare-sidecar.mjs

      - name: Build Tauri bundles
        run: pnpm exec tauri build --bundles ${{ matrix.bundles }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.os }}
          if-no-files-found: error
          compression-level: 0
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage

  publish:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v') || inputs.tag != ''
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # upload-artifact 会保留 bundle 下的子目录结构（msi/ nsis/ dmg/ deb/ appimage/），
      # dist/* 只能匹配到目录而非文件；这里先把安装包扁平化到 assets/ 再上传
      - name: Collect installers
        run: |
          find dist -type f | sort
          mkdir -p assets
          find dist -type f \( -name '*.msi' -o -name '*.exe' -o -name '*.dmg' -o -name '*.deb' -o -name '*.AppImage' \) \
            -exec cp {} assets/ \;
          if [ -z "$(ls -A assets 2>/dev/null)" ]; then
            echo "::error::no installer files found under dist/"
            exit 1
          fi
          ls -la assets/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}
          files: assets/*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_type == 'tag' && github.ref_name || inputs.tag, '-') }}
